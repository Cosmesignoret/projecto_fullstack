<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Usuario</title>
  <link rel="stylesheet" href="cssdev/cssdev.css">
</head>
<body>

  <aside class="sidebar">
    <div class="section-group">
      <div class="sidebar-logo">Stog</div>
      <a href="dev.html">📊 Dashboard</a>
      <a href="productos-admin.html">📦 Productos</a>
      <a href="#">🏬 Solicitudes</a>
      <a href="#">📄 Historial</a>
      <a href="#">👥 Empleados</a>
      <a href="usuarios.html" class="active">👥 Usuarios</a>
    </div>

    <div class="section-group">
      <a href="#">⚙️ Opciones</a>
      <a href="#">👤 Perfil</a>
      <a href="#">🔍 Buscar</a>
      <a href="#">❓ Ayuda</a>
      <div class="divider"></div>
      <a href="#">👤 Admin</a>
    </div>
  </aside>

  <main class="main-content">
    <h1>NUEVO USUARIO</h1>

    <div class="form-box">
      <form id="formularioUsuario" novalidate>
        
        <div class="field">
          <label>RUN (Sin puntos ni guión)*</label>
          <input type="text" id="run" maxlength="9" placeholder="Ej: 19011022K">
          <span class="error-msg" id="errorRun"></span>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Nombre*</label>
            <input type="text" id="nombre" maxlength="50">
            <span class="error-msg" id="errorNombre"></span>
          </div>

          <div class="field">
            <label>Apellidos*</label>
            <input type="text" id="apellidos" maxlength="100">
            <span class="error-msg" id="errorApellidos"></span>
          </div>
        </div>

        <div class="field">
          <label>Correo Electrónico*</label>
          <input type="email" id="correo" maxlength="100" placeholder="nombre@duoc.cl">
          <span class="error-msg" id="errorCorreo"></span>
        </div>

        <div class="field-row">
          <div class="field">
            <label>Fecha de Nacimiento (Opcional)</label>
            <input type="date" id="fechaNacimiento">
          </div>

          <div class="field">
            <label>Tipo de Usuario*</label>
            <select id="tipoUsuario">
              <option value="">-- Seleccione --</option>
              <option value="Administrador">Administrador</option>
              <option value="Cliente">Cliente</option>
              <option value="Vendedor">Vendedor</option>
            </select>
            <span class="error-msg" id="errorTipoUsuario"></span>
          </div>
        </div>

        <div class="field">
          <label>Dirección*</label>
          <input type="text" id="direccion" maxlength="300" placeholder="Ej: Av. España 123">
          <span class="error-msg" id="errorDireccion"></span>
        </div>

        <div style="text-align: center; margin-top: 15px;">
          <button type="submit" class="btn-submit">REGISTRAR</button>
        </div>

        <div id="mensajeFinal" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>

      </form>
    </div>
  </main>

  <script src="jsdev/validar-usuario.js"></script>
</body>
</html>
