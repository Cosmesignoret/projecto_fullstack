<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Nuevo Producto - Stog</title>
  <link rel="stylesheet" href="cssdev/cssdev.css">
</head>
<body>

  <aside class="sidebar">
    <div class="section-group">
      <div class="sidebar-logo">Stog</div>
      <a href="dev.html">📊 Dashboard</a>
      <a href="productos-admin.html" class="active">📦 Productos</a>
      <a href="#">🏬 Solicitudes</a>
      <a href="#">📄 Historial</a>
      <a href="#">👥 Empleados</a>
      <a href="usuarios.html">👥 Usuarios</a>
    </div>

    <div class="section-group">
      <a href="#">⚙️ Opciones</a>
      <a href="#">👤 Perfil</a>
      <a href="#">🔍 Buscar</a>
      <a href="#">❓ Ayuda</a>
      <div class="divider"></div>
      <a href="#">👤 Admin</a>
    </div>
  </aside>

  <main class="main-content">
    <h1>NUEVO PRODUCTO</h1>

    <div class="form-box">
      <form id="formularioProducto" novalidate>
        
        <!-- CÓDIGO Y CATEGORÍA -->
        <div class="field-row">
          <div class="field">
            <label>Código / SKU*</label>
            <input type="text" id="codigo" maxlength="10" placeholder="Ej: PRD-005">
            <span class="error-msg" id="errorCodigo"></span>
          </div>

          <div class="field">
            <label>Categoría*</label>
            <select id="categoria">
              <option value="">-- Seleccione --</option>
              <option value="Accion">Acción / FPS</option>
              <option value="Mundo Abierto">Mundo Abierto</option>
              <option value="Aventura">Aventura Narrativa</option>
              <option value="Casino">Casino / Multijugador</option>
            </select>
            <span class="error-msg" id="errorCategoria"></span>
          </div>
        </div>

        <!-- NOMBRE -->
        <div class="field">
          <label>Nombre del Producto*</label>
          <input type="text" id="nombre" maxlength="60" placeholder="Ej: Doom Eternal">
          <span class="error-msg" id="errorNombre"></span>
        </div>

        <!-- PRECIO Y STOCK -->
        <div class="field-row">
          <div class="field">
            <label>Precio ($ CLP)*</label>
            <input type="number" id="precio" placeholder="Ej: 19990">
            <span class="error-msg" id="errorPrecio"></span>
          </div>

          <div class="field">
            <label>Stock Inicial*</label>
            <input type="number" id="stock" placeholder="Ej: 15">
            <span class="error-msg" id="errorStock"></span>
          </div>
        </div>

        <!-- DESCRIPCIÓN -->
        <div class="field">
          <label>Descripción del Videojuego*</label>
          <input type="text" id="descripcion" maxlength="250" placeholder="Breve resumen del juego...">
          <span class="error-msg" id="errorDescripcion"></span>
        </div>

        <div style="text-align: center; margin-top: 15px;">
          <button type="submit" class="btn-submit">GUARDAR PRODUCTO</button>
        </div>

        <div id="mensajeFinal" style="text-align: center; margin-top: 15px; font-weight: bold;"></div>

      </form>
    </div>
  </main>

  <script src="jsdev/validar-producto.js"></script>
</body>
</html>
