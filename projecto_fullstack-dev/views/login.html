<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">
    <title>Stog - Iniciar sesión</title>
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
</head>
<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-dark"
    data-bs-theme="dark">
        <div class="container">
            <a class="navbar-brand" href="../index.html">
                Stog
            </a>
            <button
                class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menuPrincipal"
                aria-controls="menuPrincipal"
                aria-expanded="false"
                aria-label="Mostrar navegación">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="menuPrincipal">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="../index.html">
                            Inicio
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="productos.html">
                            Productos
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="nosotros.html">
                            Nosotros
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="blogs.html">
                            Blogs
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="ofertas.html">
                            Ofertas
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="contacto.html">
                            Contacto
                        </a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="login.html">
                            Iniciar sesión
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="registro.html">
                            Registro
                        </a>
                    </li>
                    <li class="nav-item">
                        <span class="nav-link">
                            🛒 Carrito (0)
                        </span>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-6 col-lg-5">

                <h1 class="text-center mb-4">
                    Stog
                </h1>

                <form id="formularioLogin" class="card p-4 shadow-sm" novalidate>
                    <h2 class="h5 mb-3 text-center">
                        Inicio de sesión
                    </h2>

                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo
                        </label>
                        <input
                            type="text"
                            id="correo"
                            class="form-control"
                            autocomplete="email"
                            placeholder="Ej: alumno@correo.cl">
                        <div id="errorCorreo" class="invalid-feedback"></div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            autocomplete="current-password">
                        <div id="errorPassword" class="invalid-feedback"></div>
                    </div>

                    <button type="submit" class="btn btn-success w-100">
                        Iniciar sesión
                    </button>

                    <div id="mensajeFinal" class="mt-3"></div>

                    <p class="text-center mt-3 mb-0">
                        ¿No tienes cuenta?
                        <a href="registro.html">Regístrate aquí</a>
                    </p>
                </form>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4">
        <p class="mb-0">Stog 2026</p>
    </footer>

    <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
</script>
    <script src="../js/login.js"></script>
</body>
</html>
