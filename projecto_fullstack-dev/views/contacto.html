    <header class="bg-success text-white text-center py-5">
        <div class="container">
            <h1 class="display-4">
                Contacto
            </h1>
            <p class="lead">
                ¿Tienes dudas? Escríbenos.
            </p>
        </div>
    </header>

    <div class="container my-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <h2 class="mb-4 text-center">Información</h2>
                <ul class="list-group mb-5">
                    <li class="list-group-item">
                        <strong>Dirección:</strong> Av. Principal 123
                    </li>
                    <li class="list-group-item">
                        <strong>Teléfono:</strong> +56 9 1234 5678
                    </li>
                    <li class="list-group-item">
                        <strong>Correo:</strong> contacto@stog.cl
                    </li>
                </ul>

                <h2 class="mb-4 text-center">Escríbenos</h2>
                <form>
                    <div class="mb-3">
                        <label for="nombre" class="form-label">Nombre</label>
                        <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
                    </div>
                    <div class="mb-3">
                        <label for="correo" class="form-label">Correo electrónico</label>
                        <input type="email" class="form-control" id="correo" placeholder="nombre@correo.com">
                    </div>
                    <div class="mb-3">
                        <label for="mensaje" class="form-label">Mensaje</label>
                        <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje"></textarea>
                    </div>
                    <div class="text-center">
                        <button type="submit" class="btn btn-success btn-lg">Enviar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <footer class="bg-dark text-white text-center py-4">

    </footer>
