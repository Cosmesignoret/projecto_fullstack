    <header class="bg-success text-white text-center py-5">
        <div class="container">
            <h1 class="display-4">
                Crea tu cuenta
            </h1>
            <p class="lead">
                Regístrate para comprar tus videojuegos favoritos.
            </p>
        </div>
    </header>

    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <form id="formularioRegistro" class="card p-4 shadow-sm" novalidate>

                    <!-- NOMBRE -->
                    <div class="mb-3">
                        <label for="nombre" class="form-label">
                            Nombre
                        </label>
                        <input
                            type="text"
                            id="nombre"
                            class="form-control"
                            autocomplete="given-name"
                            placeholder="Ej: Carolina">
                        <div id="errorNombre" class="invalid-feedback"></div>
                    </div>

                    <!-- APELLIDO -->
                    <div class="mb-3">
                        <label for="apellido" class="form-label">
                            Apellido
                        </label>
                        <input
                            type="text"
                            id="apellido"
                            class="form-control"
                            autocomplete="family-name"
                            placeholder="Ej: Soto">
                        <div id="errorApellido" class="invalid-feedback"></div>
                    </div>

                    <!-- CORREO -->
                    <div class="mb-3">
                        <label for="correo" class="form-label">
                            Correo electrónico
                        </label>
                        <input
                            type="text"
                            id="correo"
                            class="form-control"
                            autocomplete="email"
                            placeholder="Ej: alumno@correo.cl">
                        <div id="errorCorreo" class="invalid-feedback"></div>
                    </div>

                    <!-- EDAD -->
                    <div class="mb-3">
                        <label for="edad" class="form-label">
                            Edad
                        </label>
                        <input
                            type="text"
                            id="edad"
                            class="form-control"
                            placeholder="Ej: 20">
                        <div id="errorEdad" class="invalid-feedback"></div>
                    </div>

                    <!-- CONTRASEÑA -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Contraseña
                        </label>
                        <input
                            type="password"
                            id="password"
                            class="form-control"
                            autocomplete="new-password"
                            placeholder="Mínimo 6 caracteres">
                        <div id="errorPassword" class="invalid-feedback"></div>
                    </div>

                    <!-- REPETIR CONTRASEÑA -->
                    <div class="mb-3">
                        <label for="confirmarPassword" class="form-label">
                            Repetir contraseña
                        </label>
                        <input
                            type="password"
                            id="confirmarPassword"
                            class="form-control"
                            autocomplete="new-password">
                        <div id="errorConfirmarPassword" class="invalid-feedback"></div>
                    </div>

                    <!-- TÉRMINOS -->
                    <div class="mb-2 form-check">
                        <input
                            type="checkbox"
                            id="terminos"
                            class="form-check-input">
                        <label for="terminos" class="form-check-label">
                            Acepto los términos y condiciones
                        </label>
                        <div id="errorTerminos" class="invalid-feedback"></div>
                    </div>

                    <!-- BOTÓN -->
                    <button type="submit" class="btn btn-success w-100 mt-3">
                        Registrar cliente
                    </button>

                    <!-- MENSAJE FINAL -->
                    <div id="mensajeFinal" class="mt-3"></div>
                </form>
            </div>
        </div>
    </main>
